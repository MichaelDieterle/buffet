name: Finalize public app

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove remaining frontend authentication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('client/src/App.tsx')
          s = p.read_text()

          # Remove auth state/callbacks and the login/logout UI.
          patterns = [
              r"\s*const \[token, setToken\] = useState<string \| null>\([^;]+\);",
              r"\s*useEffect\(\(\) => \{\s*const params = new URLSearchParams\(window\.location\.search\);.*?\}, \[\]\);",
              r"\s*const handleLogout\s*=\s*\(\)\s*=>\s*\{.*?\};",
              r"\s*const handleGoogleLogin\s*=\s*\(\)\s*=>\s*\{.*?\};",
              r"\s*\{token\s*\?\s*<button[^>]*btn-logout[^>]*>.*?</button>\s*:\s*<button[^>]*btn-google[^>]*>.*?</button>\}",
              r"\s*\{token\s*\?\s*<button[^>]*>.*?</button>\s*:\s*<button[^>]*btn-google[^>]*>.*?</button>\}",
          ]
          for pat in patterns:
              s = re.sub(pat, '', s, flags=re.S)

          # Replace the portfolio auth gate using the exact current expression shape.
          s = re.sub(
              r'\{view === "portfolio" && \(token \? <PortfolioView /> : <div className="placeholder">.*?</div>\)\}',
              '{view === "portfolio" && <PortfolioView />}',
              s,
              flags=re.S,
          )

          forbidden = [
              "localStorage.getItem('token')", "localStorage.setItem('token'", "localStorage.removeItem('token'",
              'setToken(', 'handleGoogleLogin', 'handleLogout', '/api/auth/google', 'Sign in with Google',
              'btn-google', 'btn-logout'
          ]
          bad = [x for x in forbidden if x in s]
          if bad:
              raise SystemExit('Frontend auth remnants remain: ' + ', '.join(bad))
          if re.search(r'\btoken\b', s):
              raise SystemExit('Frontend auth token identifier remains')
          p.write_text(s)
          PY

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Run backend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Commit finalization and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.tsx package-lock.json CLAUDE.md .github/workflows/finalize-public-app.yml
          git rm -f .github/workflows/finalize-public-app.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize public app and remove remaining auth"
          git push origin HEAD:master
