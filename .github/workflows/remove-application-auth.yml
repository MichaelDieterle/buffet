name: Remove application authentication

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !startsWith(github.event.head_commit.message, 'Remove application authentication') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove authentication code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('client/src/App.tsx')
          s = p.read_text()
          s = s.replace("  const [token, setToken] = useState<string | null>(localStorage.getItem('token'));\n", "")
          s = s.replace("  useEffect(() => { const params = new URLSearchParams(window.location.search); const tokenParam = params.get('token'); if (tokenParam) { localStorage.setItem('token', tokenParam); setToken(tokenParam); window.history.replaceState({}, document.title, window.location.pathname); } }, []);\n", "")
          s = s.replace("  const handleLogout = () => { localStorage.removeItem('token'); setToken(null); setView(\"watchlist\"); };\n  const handleGoogleLogin = () => { window.location.href = '/api/auth/google'; };\n", "")
          s = s.replace("    {token ? <button className=\"btn-logout\" onClick={handleLogout} style={{ position: 'absolute', right: '20px', top: '20px' }}>Logout</button> : <button className=\"btn-google\" onClick={handleGoogleLogin} style={{ position: 'absolute', right: '20px', top: '20px' }}>Sign in with Google</button>}\n", "")
          s = s.replace("{view === \"portfolio\" && (token ? <PortfolioView /> : <div className=\"placeholder\"><p>Bitte melde dich mit Google an, um dein Portfolio zu verwalten.</p><button className=\"btn-google\" onClick={handleGoogleLogin}>Sign in with Google</button></div>)}", "{view === \"portfolio\" && <PortfolioView />}")
          p.write_text(s)

          p = Path('client/src/api.ts')
          s = p.read_text()
          interceptor = "api.interceptors.request.use((config) => {\n  const token = localStorage.getItem('token');\n  if (token) {\n    config.headers.Authorization = `Bearer ${token}`;\n  }\n  return config;\n});\n\n"
          s = s.replace(interceptor, '')
          p.write_text(s)

          p = Path('src/server.js')
          s = p.read_text().replace("const authRoutes = require('./routes/auth');\n", '').replace("app.use('/api/auth', authRoutes);\n", '')
          p.write_text(s)

          for name in ['src/routes/comparisons.js', 'src/routes/competitors.js']:
              p = Path(name)
              s = p.read_text().replace("const { authenticate } = require('../middleware/auth');\n", '')
              s = s.replace('authenticate, ', '').replace(', authenticate', '')
              p.write_text(s)

          p = Path('src/routes/stocks.js')
          s = p.read_text().replace("const { authenticate, isAdmin } = require('../middleware/auth');\n", '')
          s = s.replace("router.get('/_admin/refresh-status', authenticate, isAdmin, async (req, res) => {", "router.get('/_admin/refresh-status', async (req, res) => {")
          s = s.replace("router.post('/_admin/refresh', authenticate, isAdmin, async (req, res) => {", "router.post('/_admin/refresh', async (req, res) => {")
          s = s.replace("router.post('/', authenticate, validate", "router.post('/', validate")
          s = s.replace("router.post('/:symbol/refresh', authenticate, validate", "router.post('/:symbol/refresh', validate")
          s = s.replace("router.delete('/:symbol', authenticate, validate", "router.delete('/:symbol', validate")
          s = s.replace("router.get('/_admin/refresh-status', async (req, res) => {\n  res.json(refresh.getStatus());\n});", "router.get('/_admin/refresh-status', async (req, res) => {\n  res.status(404).json({ error: 'Not found' });\n});")
          s = s.replace("router.post('/_admin/refresh', async (req, res) => {\n  const result = await refresh.refreshAll();\n  res.json(result);\n});", "router.post('/_admin/refresh', async (req, res) => {\n  res.status(404).json({ error: 'Not found' });\n});")
          p.write_text(s)

          p = Path('src/routes/portfolios.js')
          s = p.read_text().replace("const { authenticate } = require('../middleware/auth');\n", '')
          s = s.replace("router.get('/valuation', authenticate, async", "router.get('/valuation', async")
          s = s.replace("router.get('/', authenticate, async", "router.get('/', async")
          s = s.replace("router.post('/import', authenticate, upload.single('file'), async", "router.post('/import', upload.single('file'), async")
          old = """const portfolio = await Portfolio.findOne({\n      where: { userId: req.user.id },\n      include: [{ model: Holding, as: 'holdings' }],\n    });"""
          new = """const portfolio = await Portfolio.findOne({\n      order: [['id', 'ASC']],\n      include: [{ model: Holding, as: 'holdings' }],\n    });"""
          s = s.replace(old, new)
          old_create = """const [portfolio] = await Portfolio.findOrCreate({\n        where: { userId: req.user.id },\n        defaults: { userId: req.user.id },\n        transaction,\n      });"""
          new_create = """let portfolio = await Portfolio.findOne({ order: [['id', 'ASC']], transaction });\n      if (!portfolio) {\n        portfolio = await Portfolio.create({}, { transaction });\n      }"""
          s = s.replace(old_create, new_create)
          p.write_text(s)
          PY

          # Keep the legacy User table/model for data preservation, but remove
          # application-level auth implementation and its runtime dependencies.
          rm -f src/routes/auth.js src/middleware/auth.js src/config/passport.js
          npm uninstall --no-audit --no-fund jsonwebtoken bcryptjs || true

          cat > test/security.test.js <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const request = require('supertest');
          const express = require('express');
          const validate = require('../src/middleware/validate');
          const errorHandler = require('../src/middleware/errorHandler');
          const schemas = require('../src/middleware/schemas');

          function createTestApp(routes) {
            const app = express();
            app.use(express.json());
            routes(app);
            app.use(errorHandler);
            return app;
          }

          test('Validation middleware', async (t) => {
            await t.test('rejects invalid stock payloads', async () => {
              const app = createTestApp((app) => {
                app.post('/test', validate({ body: schemas.createStock }), (req, res) => res.status(200).json({ success: true }));
              });
              const res = await request(app).post('/test').send({ symbol: '' });
              assert.equal(res.status, 400);
              assert.equal(res.body.error, 'Validation failed');
              assert.ok(Array.isArray(res.body.details));
            });

            await t.test('accepts valid stock payloads', async () => {
              const app = createTestApp((app) => {
                app.post('/test', validate({ body: schemas.createStock }), (req, res) => res.status(200).json({ success: true }));
              });
              const res = await request(app).post('/test').send({ symbol: 'AAPL', name: 'Apple' });
              assert.equal(res.status, 200);
              assert.equal(res.body.success, true);
            });
          });
          EOF

          # Authentication is intentionally gone; ensure no executable auth
          # references remain in the application source after this migration.
          if grep -R -n -E "require\(['\"]\.\.?/.*(auth|passport)|jsonwebtoken|JWT_SECRET|localStorage\.getItem\(['\"]token|Authorization.*Bearer|req\.user|authenticate|isAdmin|/api/auth" src client/src test --exclude-dir=node_modules; then
            echo 'Residual application authentication references found.'
            exit 1
          fi

          # Remove this one-shot migration workflow itself before committing.
          rm -f .github/workflows/remove-application-auth.yml

      - name: Verify and commit
        shell: bash
        run: |
          npm test
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove application authentication" || exit 0
          git push origin HEAD:master
